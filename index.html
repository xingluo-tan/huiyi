<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星落的小屋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, sans-serif;
        }

        /* 最外层全屏背景 —— 丝滑、不卡、手机适配 */
        .wrap {
            width: 100%;
            height: 100vh;
            background: url("tuku/yinghua.gif") no-repeat center center;
            background-size: cover;
            background-attachment: scroll;
            position: relative;
            padding: 15px;
        }

        /* 左上角标题 */
        .title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
            z-index: 99;
        }

        /* 左侧导航 */
        .nav {
            position: absolute;
            top: 70px;
            left: 20px;
            width: 90px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
            z-index: 10;
        }

        .nav a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }

        /* 右侧内容区域 —— 手机完美适配 */
        .right {
            position: absolute;
            top: 70px;
            left: 125px;
            right: 20px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            z-index: 10;
        }

        /* 头像盒子 —— 右上居中 */
        .avatar {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            align-self: center;
        }

        .avatar img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 内容盒子 */
        .box {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(6px);
            padding: 15px;
            text-align: center;
        }

        .box p {
            margin-bottom: 8px;
            color: #222;
        }

        .box a {
            color: #0066cc;
            text-decoration: none;
            margin: 5px 0;
            display: block;
        }

        .name {
            color: #6dd1ce;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="title">星落的小屋</div>

        <div class="nav">
            <a href="#">首页</a>
            <a href="#">关于我</a>
            <a href="#">联系方式</a>
        </div>

        <div class="right">
            <div class="avatar">
                <img src="tuku/touxiang.jpeg" alt="头像">
            </div>
            <div class="box">
                <p>大家好呀，我是<span class="name">星落</span>。欢迎来到我的个人介绍。</p>
                <p>我是一个懒人，喜欢打游戏，更喜欢和朋友一起打游戏。</p>
                <p>下面是我的抖音和b站账号～</p>
            </div>
            <div class="box">
                <p>我的链接</p>
                <a href="https://www.douyin.com/user/self?from=qrcode&account=93589215007" target="_blank">抖音</a>
                <a href="https://space.bilibili.com/286111015" target="_blank">bilibili</a>
            </div>
        </div>
    </div>
</body>

</html>
